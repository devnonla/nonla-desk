name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # In-app updates: on only when these are configured (see scripts/build-app.ts).
      NONLA_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:web

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build app (universal DMG + update archive)
        run: bun scripts/build-app.ts --target universal-apple-darwin --archive

      - name: Update manifest
        if: env.NONLA_UPDATER_PUBKEY != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: bun scripts/updater-manifest.ts && cat release/latest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nonla-desk-macos
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG="v${VERSION}"
          COMMIT="${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating assets"
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes "Automated build from \`${COMMIT}\` on \`${GITHUB_REF_NAME}\`."
          else
            echo "Creating release $TAG"
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --notes "Automated build from \`${COMMIT}\` on \`${GITHUB_REF_NAME}\`."
          fi
